name: Build APK
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The fixed release key lives in repository secrets, so every build can be installed over the previous one.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.FORAPP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FORAPP_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > forapp-release.p12
            printf 'storeFile=forapp-release.p12\nstorePassword=%s\nkeyAlias=forapp\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          fi
      # A v1.2.3 tag builds version 1.2.3; any other build is a dev build.
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV; else echo "NAME=1.1.0-dev.${{ github.run_number }}" >> $GITHUB_ENV; fi
      - run: chmod +x gradlew && ./gradlew --no-daemon -PversionCode=${{ github.run_number }} -PversionName=$NAME testDebugUnitTest assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk ForApp-$NAME.apk
      - uses: actions/upload-artifact@v4
        with:
          name: forapp-apk
          path: ForApp-*.apk
      # Pushing a v* tag publishes a release; the app's "check for update" reads the latest one.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ForApp-$NAME.apk --title "فوراپ $NAME" --notes-file .github/release-notes.md
